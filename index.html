<!doctype html><html lang="es"><head><meta charset="utf-8">

<title>Nido</title>
<meta name="theme-color" content="#2A1D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nido">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-column phone app — sticky header, content, fixed bottom tab bar. Photos are framed as polaroids; captions handwritten. */
:root{
  --bg:#F6F3F8; --surface:#FFFFFF; --paper:#FFFFFF; --ink:#22192F; --muted:#6F6681; --line:#E7E1EE;
  --accent:#C93A64; --accent-ink:#FFFFFF; --soft:#F9E3EA; --teal:#2C6E69; --teal-soft:#DCEDEA;
  --hero-bg:#2A1D3A; --hero-fg:#FBF3F6; --hero-muted:#C9BAD8; --trip-bg:#2C6E69; --map-land:#E4DEEB; --map-wish:#F2B8C9;
  --ok:#2C7A4B; --warn:#B4651B;
  --shadow:0 1px 2px rgba(34,25,47,.06),0 10px 28px rgba(34,25,47,.08);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --r:18px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141019; --surface:#1E1826; --paper:#2A2333; --ink:#F2EDF7; --muted:#A79EB7; --line:#2F2839;
  --accent:#F0698F; --accent-ink:#1A0E14; --soft:#3A1E2B; --teal:#6CC0B6; --teal-soft:#1B2E2C;
  --hero-bg:#2A1F36; --hero-fg:#FBF3F6; --hero-muted:#BFAED0; --trip-bg:#1F4E4A; --map-land:#2D2637; --map-wish:#6B3247;
  --ok:#6BC58E; --warn:#E5A15E; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141019; --surface:#1E1826; --paper:#2A2333; --ink:#F2EDF7; --muted:#A79EB7; --line:#2F2839;
  --accent:#F0698F; --accent-ink:#1A0E14; --soft:#3A1E2B; --teal:#6CC0B6; --teal-soft:#1B2E2C;
  --hero-bg:#2A1F36; --hero-fg:#FBF3F6; --hero-muted:#BFAED0; --trip-bg:#1F4E4A; --map-land:#2D2637; --map-wish:#6B3247;
  --ok:#6BC58E; --warn:#E5A15E; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:18px;height:18px}
.ico.fill{fill:currentColor}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.03em;display:flex;align-items:baseline;gap:6px}
.brand i{font-style:normal;color:var(--accent)}
.top-title{font-family:var(--f-display);font-weight:700;font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--ink)}
.iconbtn:hover{background:var(--surface)}
.badge{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center}

main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
.screen{display:flex;flex-direction:column;gap:22px;padding-block:6px 0}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] .ico{stroke-width:2.2}

/* generic */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:20px;font-weight:700}
.eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.teal{background:var(--teal);color:var(--surface)}
.btn.danger{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn.sm{height:36px;padding:0 14px;font-size:13.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{color:var(--accent);font-weight:600;font-size:14px}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px var(--line);gap:2px}
.seg button{flex:1;height:36px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--accent);white-space:nowrap}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.gray{background:var(--bg);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.empty{text-align:center;padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px}
.empty .ico{width:34px;height:34px;color:var(--accent);stroke-width:1.5}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);z-index:24;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab .ico{width:26px;height:26px;stroke-width:2.2}
@media (min-width:660px){.fab{right:calc(50% - 300px)}}
.num{font-variant-numeric:tabular-nums}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:24px;padding:22px 20px 20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:1px solid color-mix(in srgb,var(--hero-fg) 14%,transparent);box-shadow:0 0 0 22px color-mix(in srgb,var(--hero-fg) 4%,transparent),0 0 0 46px color-mix(in srgb,var(--hero-fg) 3%,transparent)}
.hero-names{font-family:var(--f-hand);font-size:26px;line-height:1;color:var(--hero-muted)}
.days-big{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,22vw,96px);line-height:.95;letter-spacing:-.04em;margin-top:10px;font-variant-numeric:tabular-nums}
.days-label{font-family:var(--f-display);font-weight:600;font-size:20px;margin-top:2px}
.days-sub{color:var(--hero-muted);font-size:13.5px;margin-top:8px}
.cd-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cd{padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.cd b{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cd .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd.trip b{color:var(--teal)} .cd.ann b{color:var(--accent)}

/* polaroid */
.pola{background:var(--paper);padding:8px 8px 10px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.08),0 14px 30px rgba(34,25,47,.12);display:flex;flex-direction:column;gap:6px}
.pola img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px;display:block;background:var(--line)}
.pola .cap{font-family:var(--f-hand);font-size:22px;line-height:1.1;padding:0 4px;color:var(--ink);min-height:24px}
.otd{display:grid;grid-template-columns:minmax(0,46%) 1fr;gap:18px;align-items:center;padding:18px}
.otd .pola{transform:rotate(-3deg)}
.otd .pola img{aspect-ratio:4/5}
.otd-txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.otd-txt h3{font-size:19px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);font-weight:500}

/* note preview */
.notep{padding:16px;display:flex;flex-direction:column;gap:8px}
.notep q{font-family:var(--f-hand);font-size:26px;line-height:1.15;quotes:none}

/* albums */
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.acard{text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.acover{aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--muted);position:relative}
.acover img{width:100%;height:100%;object-fit:cover;display:block}
.acover .cnt{position:absolute;right:8px;bottom:8px;background:rgba(20,16,25,.62);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;backdrop-filter:blur(6px)}
.acard h3{font-size:16px;font-weight:700;line-height:1.2}
.acard .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;border-radius:14px;overflow:hidden}
.pgrid button{aspect-ratio:1;position:relative;background:var(--line);overflow:hidden}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .fav{position:absolute;right:5px;bottom:5px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.pgrid .fav .ico{width:16px;height:16px;fill:#fff;stroke:#fff}
.ahead{display:flex;flex-direction:column;gap:6px}
.ahead h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.metarow{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--muted);font-size:14px}
.metarow span{display:inline-flex;align-items:center;gap:5px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* viewer */
.viewer{position:fixed;inset:0;z-index:60;background:#0D0A10;color:#fff;display:flex;flex-direction:column}
.v-top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px))}
.v-top .iconbtn{color:#fff}
.v-top .iconbtn:hover{background:rgba(255,255,255,.1)}
.v-count{flex:1;text-align:center;font-weight:600;font-size:14px;opacity:.85}
.v-track{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.v-track::-webkit-scrollbar{display:none}
.v-slide{flex:0 0 100%;height:100%;scroll-snap-align:center;display:grid;place-items:center;margin:0;padding:0 4px;min-width:0}
.v-slide img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.v-cap{padding:12px max(18px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 16px);min-height:72px;display:flex;flex-direction:column;gap:2px}
.v-cap .c{font-family:var(--f-hand);font-size:26px;line-height:1.15}
.v-cap .d{font-size:12.5px;opacity:.7}
.heart-on .ico{fill:#F0698F;stroke:#F0698F}

/* trips */
.tcard{display:flex;gap:14px;align-items:stretch;padding:12px;text-align:left;width:100%}
.tthumb{width:76px;flex:none;border-radius:12px;overflow:hidden;background:var(--teal-soft);display:grid;place-items:center;font-size:34px;aspect-ratio:1}
.tthumb img{width:100%;height:100%;object-fit:cover}
.tbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center}
.tbody h3{font-size:17px;font-weight:700;line-height:1.2}
.tbody .meta{font-size:13px;color:var(--muted)}
.tlist{display:flex;flex-direction:column;gap:12px}
.thero{background:var(--trip-bg);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.thero .flag{font-size:30px;line-height:1}
.thero h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.thero .meta{opacity:.9;font-size:14px}
.thero .chip{background:rgba(255,255,255,.2);color:#fff}
.tabs2{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{height:36px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.tabs2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.item{display:flex;gap:12px;align-items:flex-start;padding:14px;text-align:left;width:100%}
.item .ib{width:38px;height:38px;border-radius:12px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;flex:none}
.item .ib.pink{background:var(--soft);color:var(--accent)}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .tx b{font-weight:600}
.item .tx span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:10px}
.day{padding:14px 16px;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px}
.day .dh{display:flex;align-items:baseline;gap:10px}
.day .dn{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--teal)}
.day .dd{font-weight:600;text-transform:capitalize}
.day .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:5px}
.bar.over i{background:var(--accent)}
.money{display:flex;flex-direction:column;gap:12px;padding:16px}
.money .big{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split div{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.split b{font-variant-numeric:tabular-nums;font-size:17px}
.settle{font-weight:600;color:var(--teal)}
.pack{display:flex;flex-direction:column}
.pack label{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.pack label:first-child{border-top:0}
.pack input[type=checkbox]{width:22px;height:22px;accent-color:var(--teal);flex:none}
.pack .done span{text-decoration:line-through;color:var(--muted)}
.pack span{flex:1;min-width:0;overflow-wrap:anywhere}
.pack .who{font-size:12px;color:var(--muted);flex:none}
.pack .del{color:var(--muted);flex:none;width:30px;height:30px;display:grid;place-items:center}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}

/* map */
.map{padding:10px;overflow:hidden}
.map svg{width:100%;height:auto;display:block}
.map path{fill:var(--map-land);stroke:var(--surface);stroke-width:.4}
.map path.v{fill:var(--accent)}
.map path.w{fill:var(--map-wish)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);padding:6px 6px 2px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.country{padding:14px 16px;display:flex;gap:12px;align-items:center}
.country .fl{font-size:28px;line-height:1}
.country .tx{flex:1;min-width:0}
.country b{display:block}
.country span{font-size:13px;color:var(--muted)}

/* timeline */
.tl{position:relative;display:flex;flex-direction:column;gap:22px;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 11px)}
.tl-year{font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:-.04em;line-height:1;color:var(--accent);margin-left:-22px;padding-top:6px}
.tl-it{position:relative;text-align:left;display:flex;flex-direction:column;gap:10px;width:100%}
.tl-it::before{content:"";position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 3px var(--accent)}
.tl-it.trip::before{box-shadow:inset 0 0 0 3px var(--teal)}
.tl-it .d{font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-it h3{font-size:20px;font-weight:700;line-height:1.15}
.tl-it p{white-space:pre-wrap;overflow-wrap:anywhere}
.tl-it .pola{width:min(78%,300px)}
.tl-it:nth-of-type(odd) .pola{transform:rotate(-2deg)}
.tl-it:nth-of-type(even) .pola{transform:rotate(1.6deg);align-self:flex-end;margin-right:6px}

/* wishes */
.wish{display:flex;gap:12px;align-items:flex-start;padding:14px}
.wcheck{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;flex:none;color:transparent}
.wcheck:hover{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.wish.done .wcheck{background:var(--accent);box-shadow:none;color:var(--accent-ink)}
.wish .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.wish h3{font-size:16.5px;font-weight:700;font-family:var(--f-body)}
.wish p{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.wish .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* notes */
.compose{display:flex;gap:8px;align-items:flex-end;padding:10px}
.compose textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;min-height:44px;max-height:140px;padding:10px 6px;outline:none}
.compose .btn{width:46px;padding:0}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;display:flex;flex-direction:column;gap:3px;align-self:flex-start}
.msg .b{background:var(--surface);box-shadow:var(--shadow);border-radius:20px 20px 20px 6px;padding:10px 14px;font-family:var(--f-hand);font-size:23px;line-height:1.2;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .m{font-size:11.5px;color:var(--muted);padding:0 8px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.mine .b{background:var(--accent);color:var(--accent-ink);border-radius:20px 20px 6px 20px}
.msg.new .b{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.daysep{align-self:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}

/* forms & sheet */
#sheet-root{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(15,10,20,.45);animation:fade .2s}
.sheet{position:relative;width:100%;max-width:620px;max-height:92%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(18px,env(safe-area-inset-left,0px));animation:up .25s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:14px}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.input,.form input:not([type=checkbox]):not([type=file]),.form select,.form textarea,.addrow input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;outline:none;font-size:16px}
.form textarea{min-height:96px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus,.addrow input:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{flex:1;min-width:110px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios span{display:flex;align-items:center;justify-content:center;height:44px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;cursor:pointer;padding:0 10px;text-align:center}
.radios input:checked+span{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.radios input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.form-actions{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.upl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.upl figure{margin:0;display:flex;flex-direction:column;gap:6px}
.upl img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--line)}
.upl input{min-height:40px!important;font-size:15px!important;padding:8px 10px!important}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick img{width:72px;height:72px;object-fit:cover;border-radius:10px}
.note-box{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

/* onboarding */
.onb{min-height:100%;display:flex;flex-direction:column;gap:22px;padding-block:28px 40px}
.onb .logo{font-family:var(--f-display);font-weight:800;font-size:64px;letter-spacing:-.05em;line-height:.9}
.onb .logo i{font-style:normal;color:var(--accent)}
.onb .lede{font-family:var(--f-hand);font-size:28px;line-height:1.1;color:var(--muted)}
.who{display:flex;flex-direction:column;gap:12px}
.who button{padding:18px;display:flex;align-items:center;gap:14px;text-align:left;font-size:18px;font-weight:700;font-family:var(--f-display)}
.who button:disabled{opacity:.45}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-weight:800;font-family:var(--f-display);font-size:18px;flex:none}
.state{padding:60px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:100;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow);transition:opacity .25s,transform .25s}
#toast.off{opacity:0;transform:translate(-50%,10px);pointer-events:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}.cd b{font-size:28px}}

function errMsg(e) {
  const c = e?.code;
  if (e?.name === 'QuotaExceededError') return 'El móvil no tiene espacio para guardar más. Libera espacio y prueba otra vez.';
  if (c === 'invalid_argument' || c === 'not_granted') return 'No tienes permiso para guardar. Pide acceso de Editor.';
  if (c === 'quota_exceeded' || c === 'quota_or_state') return 'Se ha llenado el espacio. Borra algo para seguir.';
  if (c === 'too_large') return 'Esa foto es demasiado grande.';
  if (c === 'unsupported_type') return 'Ese formato de imagen no se puede subir.';
  if (c === 'rate_limited' || c === 'resource_exhausted') return 'Demasiado rápido. Espera un momento y vuelve a probar.';
  return 'No se pudo guardar. Comprueba la conexión y prueba otra vez.';
}
async function W(p, ok) { try { const r = await p; if (ok) toast(ok); return r; } catch (e) { console.error(e); toast(errMsg(e)); throw e; } }
const col = c => S.db.collection(c);
const docRef = (c, id) => S.db.doc(`${c}/${id}`);

/* ============ derived data ============ */
function tripState(t) {
  const td = today(); if (!t.start) return 'plan';
  const end = t.end || t.start;
  if (end < td) return 'done'; if (t.start <= td) return 'now'; return 'plan';
}
const photoDate = p => p.taken || S.albums.find(a => a.id === p.albumId)?.date || (p.at ? ymd(new Date(p.at)) : '');
const sortPhotos = list => [...list].sort((a, b) => (photoDate(a) || '').localeCompare(photoDate(b) || '') || (a.at || 0) - (b.at || 0));
const albumPhotos = id => sortPhotos(S.photos.filter(p => p.albumId === id));
function albumCover(a) {
  if (!a) return null;
  const c = a.cover && S.photos.find(p => p.id === a.cover);
  return c || albumPhotos(a.id)[0] || null;
}
function nextAnniv() {
  const list = [];
  if (S.cfg?.start) list.push({label: 'Aniversario', date: S.cfg.start});
  S.moments.filter(m => m.kind === 'primera' && m.date).forEach(m => list.push({label: 'Aniversario de la primera cita', date: m.date}));
  const td = today(), y = new Date().getFullYear();
  let best = null;
  for (const it of list) {
    const md = it.date.slice(5);
    let nd = `${y}-${md}`; if (md === '02-29' && !pd(nd)) nd = `${y}-03-01`;
    if (nd < td) nd = `${y + 1}-${md}`;
    const years = Number(nd.slice(0, 4)) - Number(it.date.slice(0, 4));
    if (years < 1) continue;
    const d = daysBetween(td, nd);
    if (!best || d < best.days) best = {...it, next: nd, days: d, years};
  }
  return best;
}
function nextTrip() {
  return S.trips.filter(t => t.start && tripState(t) !== 'done').sort((a, b) => a.start.localeCompare(b.start))[0] || null;
}
function places() {
  const map = {};
  S.trips.filter(t => t.country && tripState(t) !== 'plan').forEach(t => {
    const c = map[t.country] ||= {cc: t.country, cities: new Set(), trips: 0};
    c.trips++; (t.dest || '').split(/[,·\/]| y /).map(s => s.trim()).filter(Boolean).forEach(x => c.cities.add(x));
  });
  return Object.values(map).sort((a, b) => countryName(a.cc).localeCompare(countryName(b.cc), 'es'));
}
function stats() {
  const pl = places();
  const cities = new Set(); pl.forEach(p => p.cities.forEach(c => cities.add(c.toLowerCase() + '|' + p.cc)));
  return {
    countries: pl.length, cities: cities.size,
    trips: S.trips.filter(t => tripState(t) === 'done').length,
    planned: S.trips.filter(t => tripState(t) !== 'done').length,
    photos: S.photos.length, favs: S.photos.filter(p => p.fav).length, albums: S.albums.length,
    moments: S.moments.length, wishesDone: S.wishes.filter(w => w.done).length, wishes: S.wishes.length,
  };
}
function unread() { const me = mySlot(); return S.notes.filter(n => n.by !== me && (n.at || 0) > S.seen).length; }
function togetherParts() {
  if (!S.cfg?.start) return null;
  const a = pd(S.cfg.start), b = pd(today());
  let y = b.getFullYear() - a.getFullYear(), m = b.getMonth() - a.getMonth(), d = b.getDate() - a.getDate();
  if (d < 0) { m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  return {y, m, d, total: daysBetween(S.cfg.start, today())};
}
function onThisDay() {
  const td = today(), md = td.slice(5), yr = td.slice(0, 4);
  const pool = [];
  S.photos.forEach(p => { const d = photoDate(p); if (d && d.slice(5) === md && d.slice(0, 4) < yr) pool.push({t: 'p', p, d}); });
  S.moments.forEach(m => { if (m.date && m.date.slice(5) === md && m.date.slice(0, 4) < yr) pool.push({t: 'm', m, d: m.date}); });
  if (pool.length && S.otd === 0) return {...pool[0], same: true, pool};
  const all = [...S.photos.map(p => ({t: 'p', p, d: photoDate(p)})), ...S.moments.filter(m => m.thumb || m.text).map(m => ({t: 'm', m, d: m.date}))];
  const src = pool.length ? pool : all; if (!src.length) return null;
  const seed = Number(td.replace(/-/g, '')) + S.otd * 7919;
  const it = src[seed % src.length];
  return {...it, same: !!pool.length};
}

/* ============ render ============ */
let raf = 0;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }

function render() {
  const scr = $('#screen'), a = document.activeElement;
  let keep = null;
  if (a && a.id && scr.contains(a) && ('value' in a)) keep = {id: a.id, v: a.value, s: a.selectionStart, e: a.selectionEnd};
  const {top, body, nav} = view();
  $('#topbar').innerHTML = top; scr.innerHTML = body;
  $('#nav').hidden = !nav;
  document.querySelectorAll('#nav [data-tab]').forEach(b => b.toggleAttribute('aria-current', false) || (b.dataset.tab === S.tab && b.setAttribute('aria-current', 'page')));
  if (keep) { const n = document.getElementById(keep.id); if (n) { n.value = keep.v; n.focus({preventScroll: true}); try { n.setSelectionRange(keep.s, keep.e); } catch {} } }
  if (S.viewer) updateViewer();
}

function brandTop() {

}
const backTop = (title, act, extra = '') => `<button class="iconbtn" data-act="${act}" aria-label="Volver">${ic('back')}</button><div class="top-title">${esc(title)}</div>${extra}`;

function view() {
  if (S.err === 'nodb') return {top: '<div class="brand">Nido<i>.</i></div>', body: `<div class="state">${ic('heart')}<h3>No se pudo abrir Nido</h3><p>El móvil no deja usar el almacenamiento de la app. Ciérrala del todo y vuelve a abrirla desde su icono.</p></div>`};
  if (S.cfg === undefined) return {top: '<div class="brand">Nido<i>.</i></div>', body: `<div class="state"><div class="spin"></div><p>${S.slow ? 'Cuesta conectar. Revisa tu conexión; seguimos intentándolo.' : 'Abriendo vuestro nido…'}</p></div>`};
  if (S.cfg === null) return {top: '', body: vOnboard()};
  if (!mySlot()) return {top: '', body: vWho()};
  if (S.tab === 'albumes' && S.album) return vAlbum();
  if (S.tab === 'viajes' && S.trip) return vTrip();
  const top = S.tab === 'notas' ? backTop('Notas', 'tab" data-tab="inicio') : brandTop();
  const body = ({inicio: vHome, albumes: vAlbums, viajes: vTrips, historia: vTimeline, deseos: vWishes, notas: vNotes}[S.tab] || vHome)();
  return {top, body, nav: true};
}

/* ---- trips ---- */

  const dleft = t.start ? daysBetween(today(), t.start) : null;

    <div class="tbody"><h3>${esc(t.dest)}</h3><div class="meta">${flag(t.country)} ${esc(countryName(t.country))}</div><div class="meta">${esc(fmtRange(t.start, t.end))}</div>
      <div>${st === 'now' ? '<span class="chip teal">De viaje ahora</span>' : st === 'plan' ? (dleft != null ? `<span class="chip teal">En ${plural(dleft, 'día')}</span>` : '<span class="chip gray">Por fechar</span>') : '<span class="chip">Hecho</span>'}</div></div></button>`;

function vTrips() {
  const seg = `<div class="seg"><button data-act="seg" data-k="tripsSeg" data-v="prox" aria-pressed="${S.tripsSeg === 'prox'}">Planeados</button><button data-act="seg" data-k="tripsSeg" data-v="hechos" aria-pressed="${S.tripsSeg === 'hechos'}">Hechos</button><button data-act="seg" data-k="tripsSeg" data-v="lugares" aria-pressed="${S.tripsSeg === 'lugares'}">Lugares</button></div>`;
  if (S.tripsSeg === 'lugares') return seg + vPlaces();
  const done = S.tripsSeg === 'hechos';
  const list = S.trips.filter(t => (tripState(t) === 'done') === done).sort((a, b) => done ? (b.start || '').localeCompare(a.start || '') : (a.start || '9999').localeCompare(b.start || '9999'));
  return `${seg}${list.length ? `<div class="tlist">${list.map(tripCard).join('')}</div>` : `<div class="empty">${ic('plane')}<h3>${done ? 'Aún no hay viajes hechos' : 'Ningún viaje en marcha'}</h3><p>${done ? 'Los viajes pasan aquí solos cuando termina su última fecha.' : 'Apuntad destino y fechas; luego id añadiendo vuelos, alojamiento, días y gastos.'}</p></div>`}
  <button class="fab" data-act="newTrip" aria-label="Nuevo viaje">${ic('plus')}</button>`;
}
let worldCache = {key: '', svg: ''};
function worldSvg(visited, wished) {
  const W = window.__WORLD; if (!W) return '';
  const key = [...visited].join() + '|' + [...wished].join();
  if (worldCache.key === key && worldCache.svg) return worldCache.svg;
  const svg = `<svg viewBox="0 0 ${W.width} ${Math.ceil(W.height)}" role="img" aria-label="Mapa de países visitados">${Object.entries(W.paths).map(([cc, p]) => `<path d="${p.path}" class="${visited.has(cc) ? 'v' : wished.has(cc) ? 'w' : ''}"><title>${esc(countryName(cc))}</title></path>`).join('')}</svg>`;
  worldCache = {key, svg}; return svg;
}
function vPlaces() {
  const pl = places(), visited = new Set(pl.map(p => p.cc));
  const wished = new Set([...S.wishes.filter(w => !w.done && w.country).map(w => w.country), ...S.trips.filter(t => tripState(t) === 'plan' && t.country).map(t => t.country)]);
  const svg = worldSvg(visited, wished);
  return `<div class="card map">${svg || '<div class="state" style="padding:40px 10px"><div class="spin"></div><p>Cargando mapa…</p></div>'}

/* image processing */
async function loadImg(file) {
  if ('createImageBitmap' in window) { try { return await createImageBitmap(file, {imageOrientation: 'from-image'}); } catch {} }
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
}
function resize(src, max, q) {
  const w = src.width, h = src.height, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', q));
}
async function exifDate(file) {
  try {
    const buf = await file.slice(0, 196608).arrayBuffer(), v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o < v.byteLength - 10) {
      const m = v.getUint16(o), len = v.getUint16(o + 2);
      if (m === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
        const t = o + 10, le = v.getUint16(t) === 0x4949;
        const g16 = p => v.getUint16(t + p, le), g32 = p => v.getUint32(t + p, le);
        const ifd = p => { const n = g16(p), out = {}; for (let i = 0; i < n; i++) { const e = p + 2 + i * 12; out[g16(e)] = g32(e + 8); } return out; };
        const str = off => { if (off == null) return null; let s = ''; for (let i = 0; i < 19; i++) s += String.fromCharCode(v.getUint8(t + off + i)); return s; };
        const i0 = ifd(g32(4)); let d = null;
        if (i0[0x8769] != null) d = str(ifd(i0[0x8769])[0x9003]);
        if (!d || !/^\d{4}:\d\d:\d\d/.test(d)) d = str(i0[0x0132]);
        return d && /^\d{4}:\d\d:\d\d/.test(d) && d.slice(0, 4) !== '0000' ? d.slice(0, 10).replace(/:/g, '-') : null;
      }
      if ((m & 0xFF00) !== 0xFF00) break;
      o += 2 + len;
    }
  } catch {}
  return null;
}
async function processUpload(file) {
  const [img, taken] = await Promise.all([loadImg(file), exifDate(file)]);
  const full = await resize(img, 2048, .85), th = await resize(img, 560, .8);

/* Backup file: "NIDOBK01" + 12-digit header length + JSON header + the photo files one after another. */
const MAGIC = 'NIDOBK01';
async function buildBackup(progress) {
  const docs = Object.fromEntries(LDB.docs);
  const keys = await IDB.keys('blobs'), parts = [], index = [];
  for (let i = 0; i < keys.length; i++) {
    if (i % 20 === 0) progress(`Preparando la copia… ${i} de ${keys.length} archivos`);
    const b = await IDB.get('blobs', keys[i]); if (!b) continue;
    index.push([keys[i], b.type || 'image/jpeg', b.size]); parts.push(b);
  }
  const head = new TextEncoder().encode(JSON.stringify({app: 'nido', format: 1, version: VERSION, exportedAt: new Date().toISOString(), docs, blobs: index}));
  const name = `nido-copia-${today()}.nido`;
  return new File([MAGIC, String(head.length).padStart(12, '0'), head, ...parts], name, {type: 'application/octet-stream'});
}
async function saveFile(file) {
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: file.name}); lsSet('nido-last-backup', today()); return; }
  } catch (e) { if (e?.name === 'AbortError') return; console.error(e); }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  lsSet('nido-last-backup', today());
}
async function readBackup(file) {
  if (await file.slice(0, 8).text() !== MAGIC) throw new Error('format');
  const len = parseInt(await file.slice(8, 20).text(), 10);
  const head = JSON.parse(await file.slice(20, 20 + len).text());
  if (head.app !== 'nido') throw new Error('format');
  return {head, off: 20 + len};
}
async function confirmImport(file) {
  let info;
  try { info = await readBackup(file); } catch { toast('Ese archivo no es una copia de Nido.'); return; }
  const n = Object.keys(info.head.docs).filter(k => k.startsWith('photos/')).length;
  closeSheet();
  confirmSheet('¿Importar esta copia?', `Es del ${fmtLong(info.head.exportedAt.slice(0, 10))} y tiene ${plural(n, 'foto')}. Sustituye todo lo que hay ahora en este móvil.`, 'Importar copia', async () => {
    const b = $('#cf-yes');
    try {
      await IDB.clear('docs'); await IDB.clear('blobs');
      let off = info.off, i = 0;
      for (const [id, type, size] of info.head.blobs) {
        if (i++ % 10 === 0 && b) b.textContent = `Importando… ${i} de ${info.head.blobs.length}`;
        const buf = await file.slice(off, off + size).arrayBuffer(); off += size;
        await IDB.put('blobs', id, new Blob([buf], {type}));
      }
      for (const [k, v] of Object.entries(info.head.docs)) await IDB.put('docs', k, v);
      toast('Copia importada'); setTimeout(() => location.reload(), 600);
    } catch (e) { console.error(e); toast(errMsg(e)); throw e; }
  });
}

      <div class="two"><label class="field"><span>Entrada</span><input type="date" name="from" value="${esc(c.from || getTrip(d.id).start)}"></label><label class="field"><span>Salida</span><input type="date" name="to" value="${esc(c.to || getTrip(d.id).end)}"></label></div>
      <label class="field"><span>Dirección</span><input name="address" maxlength="120" value="${esc(c.address)}"></label>
      <label class="field"><span>Notas</span><textarea name="notes" maxlength="500" placeholder="Código de reserva, check-in…">${esc(c.notes)}</textarea></label>`,
    toData: x => ({name: x.name.trim(), from: x.from, to: x.to, address: x.address.trim(), notes: x.notes.trim()})}),
  transport: d => subSheet({t: getTrip(d.id), field: 'transport', sub: d.sub, title: 'transporte', okMsg: 'Transporte guardado',
    fields: c => `<label class="field"><span>Tipo</span><select name="kind">${Object.entries(TKINDS).map(([k, [l]]) => `<option value="${k}" ${k === (c.kind || 'vuelo') ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <div class="two"><label class="field"><span>Desde</span><input name="from" required maxlength="50" value="${esc(c.from)}" placeholder="Madrid"></label><label class="field"><span>Hasta</span><input name="to" required maxlength="50" value="${esc(c.to)}" placeholder="Roma"></label></div>
      <div class="two"><label class="field"><span>Fecha</span><input type="date" name="date" value="${esc(c.date || getTrip(d.id).start)}"></label><label class="field"><span>Hora</span><input type="time" name="time" value="${esc(c.time)}"></label></div>
      <label class="field"><span>Referencia / nº de vuelo</span><input name="ref" maxlength="40" value="${esc(c.ref)}"></label>`,
    toData: x => ({kind: x.kind, from: x.from.trim(), to: x.to.trim(), date: x.date, time: x.time, ref: x.ref.trim()})}),
  expense: d => subSheet({t: getTrip(d.id), field: 'expenses', sub: d.sub, title: 'gasto', okMsg: 'Gasto guardado',
    fields: c => `<label class="field"><span>Concepto</span><input name="desc" required maxlength="60" value="${esc(c.desc)}" placeholder="Cena en el Trastevere"></label>
      <div class="two"><label class="field"><span>Importe</span><input type="number" name="amount" required inputmode="decimal" min="0" step="0.01" value="${esc(c.amount ?? '')}"></label><label class="field"><span>Fecha</span><input type="date" name="date" value="${esc(c.date || today())}"></label></div>
      <div class="field"><span>¿Quién pagó?</span><div class="radios">${['a', 'b'].map(s => `<label><input type="radio" name="payer" value="${s}" ${(c.payer || mySlot()) === s ? 'checked' : ''}><span>${esc(nameOf(s))}</span></label>`).join('')}</div></div>
      <label class="field"><span>Categoría</span><select name="cat">${ECATS.map(x => `<option ${x === c.cat ? 'selected' : ''}>${x}</option>`).join('')}</select></label>`,
    toData: x => ({desc: x.desc.trim(), amount: Math.round(Number(x.amount) * 100) / 100, date: x.date, payer: x.payer, cat: x.cat})}),
  tripNotes: d => { const t = getTrip(d.id);
    openSheet(`<h2>Notas del viaje</h2><form class="form"><textarea name="notes" maxlength="4000" style="min-height:220px">${esc(t.notes)}</textarea><div class="form-actions"><button class="btn" type="submit">Guardar</button></div></form>`,
      sh => bindForm(sh, x => W(docRef('trips', t.id).update({notes: x.notes.trim()}), 'Notas guardadas'))); },
  dayEdit: d => { const t = getTrip(d.id), i = daysBetween(t.start, d.day) + 1;
    openSheet(`<h2>Día ${i} · <span style="font-weight:600;text-transform:capitalize">${esc(fmt(d.day, {weekday:'long', day:'numeric', month:'short'}))}</span></h2><form class="form"><textarea name="txt" maxlength="3000" style="min-height:220px" placeholder="Mañana: museo&#10;Comida: …&#10;Tarde: paseo por…">${esc((t.itinerary || {})[d.day])}</textarea><div class="form-actions"><button class="btn" type="submit">Guardar</button></div></form>`,
      sh => bindForm(sh, x => W(docRef('trips', t.id).update({itinerary: {[d.day]: x.txt.trim()}}), 'Día guardado'))); },
  packToggle: async (d, el) => { await W(docRef('trips', d.id).update({packing: {[d.sub]: {done: el.checked}}})); },
  packDel: async (d, el, e) => { e.preventDefault(); await W(docRef('trips', d.id).update({packing: {[d.sub]: null}})); },
  tripAlbum: async d => { const t = getTrip(d.id);
    const r = await W(col('albums').add({title: t.dest, date: t.start || today(), place: [t.dest, countryName(t.country)].filter(Boolean).join(', '), tripId: t.id, cover: '', at: Date.now(), by: mySlot()}));
    await W(docRef('trips', t.id).update({albumId: r.id}), 'Álbum creado'); },
  moment: d => momentSheet(d.sub ? S.moments.find(m => m.id === d.sub) : null),
  wish: d => wishSheet(d.sub ? S.wishes.find(w => w.id === d.sub) : null),
  wishDone: d => { const w = S.wishes.find(x => x.id === d.sub); if (!w) return;
    momentSheet(null, {title: w.title, kind: 'deseo', wishId: w.id, text: w.note || ''}, async mid => {
      await W(docRef('wishes', w.id).update({done: true, doneAt: today(), momentId: mid})); S.wishSeg = 'hechos'; schedule(); }); },
  wishUndo: d => confirmSheet('¿Volver a pendiente?', 'El recuerdo que guardasteis se queda en la historia.', 'Marcar pendiente', () => W(docRef('wishes', d.sub).update({done: false, doneAt: ''}))),
  noteDel: d => confirmSheet('¿Borrar esta nota?', 'No se puede deshacer.', 'Borrar', () => W(docRef('notes', d.sub).delete())),
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.tagName === 'INPUT') return;
  const f = A[t.dataset.act]; if (f) { if (t.tagName === 'A') e.preventDefault(); f(t.dataset, t, e); }
});
document.addEventListener('change', e => {
  const t = e.target; if (t.matches('input[type=checkbox][data-act]')) A[t.dataset.act]?.(t.dataset, t, e);
});
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'f-onb') { e.preventDefault(); const d = formData(f), b = f.querySelector('button'); b.disabled = true;
    try { await W(S.db.doc('app/config').set({a: d.a.trim(), b: d.b.trim(), start: d.start, cur: 'EUR', members: S.uid ? {[S.uid]: 'a'} : {}, at: Date.now()})); lsSet('nido-slot', 'a'); } catch { b.disabled = false; } }
  if (f.id === 'f-note') { e.preventDefault(); const i = $('#note-in'), txt = i.value.trim(); if (!txt) return;
    i.value = ''; try { await W(col('notes').add({text: txt, by: mySlot(), at: Date.now()})); } catch { i.value = txt; } }
  if (f.id === 'f-pack') { e.preventDefault(); const i = $('#pack-in'), txt = i.value.trim(); if (!txt) return; const who = $('#pack-who').value;
    i.value = ''; try { await W(docRef('trips', f.dataset.id).update({packing: {[rid()]: {text: txt, who, done: false, at: Date.now()}}})); } catch { i.value = txt; } i.focus(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#sheet-root').hidden) closeSheet(); else if (S.viewer) closeViewer(); }
  if (S.viewer && $('#sheet-root').hidden && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { const tr = $('.v-track'); tr.scrollBy({left: (e.key === 'ArrowRight' ? 1 : -1) * tr.clientWidth, behavior: 'smooth'}); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'note-in') { e.preventDefault(); e.target.form.requestSubmit(); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['inicio', 'albumes', 'viajes', 'historia', 'deseos', 'notas'].includes(h) && h !== S.tab) go(h); });

/* ============ boot ============ */
function loadMap() {
  window.jsVectorMap = {addMap: (n, d) => { window.__WORLD = d; worldCache.key = ''; schedule(); }};
  const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js'; s.async = true; document.head.appendChild(s);
}
async function boot() {
  const h = location.hash.slice(1); if (['inicio', 'albumes', 'viajes', 'historia', 'deseos', 'notas'].includes(h)) S.tab = h;
  render();
  try { if (!window.indexedDB) throw new Error('no idb'); await LDB.load(); }
  catch (e) { console.error(e); S.err = 'nodb'; return render(); }
  S.db = LDB; S.assets = LA; S.uid = null;
  S.seen = Number(lsGet('nido-seen')) || 0;
  LDB.doc('app/config').onSnapshot(s => { S.cfg = s.exists ? s.data() : null; schedule(); });
  for (const c of ['albums', 'photos', 'trips', 'moments', 'wishes'])
    LDB.collection(c).onSnapshot(q => { S[c] = q.docs.map(d => ({id: d.id, ...d.data()})); schedule(); });
  LDB.collection('notes').orderBy('at', 'desc').limit(200).onSnapshot(q => { S.notes = q.docs.map(d => ({id: d.id, ...d.data()})); if (S.tab === 'notas') markSeen(); schedule(); });
  loadMap();
  if (S.tab === 'notas') S.seenOnOpen = 0;
  try { navigator.storage?.persist?.(); } catch {}
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(e => console.warn(e));
}
S.seenOnOpen = Infinity;
boot();
</script>

</body></html>
